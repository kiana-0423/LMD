# The exact dependency set the LMD sidecar is built and tested against.
#
# Measured from the environment the sidecar is actually built in — the Conda environment
# `lmd-build`, running Python 3.11.14 — after confirming it passes the full sidecar test suite
# (64 tests) and `python -m pip check`. It is not a wish list: `scripts/check_python_lock.py`
# compares a live interpreter against this file and `scripts/build_sidecar.py` refuses to build
# when they disagree, so a version here that nobody has installed would only ever block a build.
#
# This is a complete lock, not a list of direct dependencies. The previous file pinned nine
# packages and began with `-e .`, which had two consequences worth spelling out:
#
#   * `-e .` is resolved relative to the *working directory*, so `pip install -r
#     python-sidecar/requirements.lock` from the repository root tried to install the repository
#     root as a Python project and failed.
#   * An editable install re-resolves the project's own dependencies, so anything not pinned here —
#     joblib, networkx, threadpoolctl, python-dateutil — was whatever the index happened to be
#     serving that day. joblib and networkx are not optional extras: scikit-learn cannot save or
#     load a model without joblib, and Mordred cannot build a molecular graph without networkx.
#     Both were unpinned, and both are the kind of dependency whose next release quietly changes
#     behaviour the shipped application depends on.
#
# To install:      <python> -m pip install -r python-sidecar/requirements.lock
# To verify:       npm run sidecar:check-lock
#
# Hashes are deliberately not used. RDKit and SciPy publish per-platform wheels, and a hash set
# recorded on Apple Silicon makes the file unusable on the Windows x64 build machine — which is a
# supported target. The versions are exact, which is the property that matters for reproducibility
# across the two platforms this ships on.


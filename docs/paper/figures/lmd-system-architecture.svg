<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
<title>LMD system architecture</title>
<desc>Local desktop user interface, Rust application services, Python scientific sidecar, and local workspace storage. Only Rust reads and writes SQLite.</desc>
